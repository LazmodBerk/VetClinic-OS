version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: vcms_db
    environment:
      POSTGRES_USER: vcms_user
      POSTGRES_PASSWORD: vcms_password
      POSTGRES_DB: vcms_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: 
      context: ./backend
    container_name: vcms_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://vcms_user:vcms_password@db:5432/vcms_db
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: vcms_frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
